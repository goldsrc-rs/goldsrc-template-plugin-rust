name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check file syntax
        run: test -f Cargo.toml && test -f src/lib.rs

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Install cargo-generate
        uses: taiki-e/install-action@cargo-generate
      - name: Test generate plugin from template
        run: cargo generate --path . --name test-plugin --silent
      - name: Verify generated plugin compiles
        working-directory: test-plugin
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
